# Publishes to pub.dev when a version tag (v1.2.3) is pushed.
#
# Uses pub.dev automated publishing (OIDC), so no secrets are stored here.
# One-time setup on pub.dev > stagger_kit > Admin > Automated publishing:
#   - Enable publishing from GitHub Actions
#   - Repository: jcazalELPAKOMICHI/stagger_kit
#   - Tag pattern: v{{version}}
#   - Require environment: pub.dev
name: Publish

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # Exchanges the GitHub OIDC token for a pub.dev token.
      - uses: dart-lang/setup-dart@v1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test

      - name: Check tag matches pubspec version
        run: |
          version=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $version"
            exit 1
          fi

      - run: dart pub publish --force
