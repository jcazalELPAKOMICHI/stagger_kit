name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Package (Flutter ${{ matrix.flutter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported version and the latest stable.
        flutter: ["3.32.0", "stable"]
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter == 'stable' && 'any' || matrix.flutter }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Check formatting
        if: matrix.flutter == 'stable'
        run: dart format --output=none --set-exit-if-changed lib test example/lib

      - run: flutter analyze

      - run: flutter test --coverage

      - name: Validate package
        if: matrix.flutter == 'stable'
        run: |
          set +e
          output=$(dart pub publish --dry-run 2>&1)
          status=$?
          echo "$output"
          if [ $status -ne 0 ]; then
            # Surface the validator's findings as an annotation, skipping the
            # file tree, so they show on the run summary.
            message=$(echo "$output" | grep -vE '^[│├└ ]+[│├└]' | tail -40)
            message="${message//'%'/'%25'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error title=dart pub publish --dry-run::$message"
          fi
          exit $status

  example:
    name: Example app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build web --release
